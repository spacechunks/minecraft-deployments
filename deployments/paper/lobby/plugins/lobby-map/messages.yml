  wurde erstellt.
particle-removed: <#62748E>[Map] <#E7020C>Particle Spawner <#ffffff>{name}<#E7020C>
  wurde entfernt.
particle-list-header: <#E229FB>Particle Spawner
particle-list-entry: <#62748E>[Map] <click:run_command:'{command}'><#F1F3F3>- <#ffffff>{name}</click>
