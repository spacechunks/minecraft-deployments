  nicht gefunden.
invalid-world: <#62748E>[Map] <#E7020C>Welt <#ffffff>{world}<#E7020C> wurde nicht
  gefunden.
syntax:
  set: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map set <all/sounds/particles/loop-sound/particle-spawner/furniture/trampolin/pad>
    <true/false>'
  register: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map register <trampolin/pad>
    <world> <x> <y> <z>'
  loop-sound: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map loop-sound <create/remove/list>'
  loop-sound-create: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map loop-sound create
    <name> <sound> <interval-ticks> <radius>'
  loop-sound-remove: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map loop-sound remove
    <name>'
  particle: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map particle <create/remove/list>'
  particle-create: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map particle create
    <name> <type> <interval-ticks> <radius>'
  particle-remove: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map particle remove
    <name>'
  pushback: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map pushback <create/remove/list>'
  pushback-create: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map pushback create
    <name> <radius> <velocity x> <velocity y>'
  pushback-remove: '<#62748E>[Map] <#E7020C>Syntax: <#ffffff>/map pushback remove
    <name>'
pushback-created: <#62748E>[Map] <#99E603>Pushback <#ffffff>{name}<#99E603> wurde
  erstellt.
pushback-removed: <#62748E>[Map] <#E7020C>Pushback <#ffffff>{name}<#E7020C> wurde
  entfernt.
pushback-list-header: <#E229FB>Pushbacks
pushback-list-entry: <#62748E>[Map] <click:run_command:'{command}'><#F1F3F3>- <#ffffff>{name}</click>
help:
  root:
    header: <#E229FB>Map Commands
    '1': <#62748E>[Map] <#ffffff>/map setup <#F1F3F3>- Setup Item geben oder entfernen
    '2': <#62748E>[Map] <#ffffff>/map status <#F1F3F3>- Feature Status anzeigen
    '3': <#62748E>[Map] <#ffffff>/map set <feature> <true/false> <#F1F3F3>- Feature
      aktivieren oder deaktivieren
    '4': <#62748E>[Map] <#ffffff>/map reload <#F1F3F3>- Configs neu laden
    '5': <#62748E>[Map] <#ffffff>/map loop-sound <create/remove/list> <#F1F3F3>- Loop
      Sounds verwalten
    '6': <#62748E>[Map] <#ffffff>/map particle <create/remove/list> <#F1F3F3>- Particle
      Spawner verwalten
    '7': <#62748E>[Map] <#ffffff>/map pushback <create/remove/list> <#F1F3F3>- Pushbacks
      verwalten
  set:
    header: <#E229FB>Map Set Commands
    '1': <#62748E>[Map] <#ffffff>/map set <all/sounds/particles/loop-sound/particle-spawner/pushback/furniture/trampolin/pad>
      <true/false>
    '2': '<#62748E>[Map] <#F1F3F3>Beispiel: <#ffffff>/map set pushback true'
  register:
    header: <#E229FB>Register Commands
    '1': <#62748E>[Map] <#ffffff>/map register trampolin <world> <x> <y> <z>
    '2': <#62748E>[Map] <#ffffff>/map register pad <world> <x> <y> <z>
  loop-sound:
    header: <#E229FB>Loop Sound Commands
    '1': <#62748E>[Map] <#ffffff>/map loop-sound create <name> <sound> <interval-ticks>
    '2': <#62748E>[Map] <#ffffff>/map loop-sound remove <name>
    '3': <#62748E>[Map] <#ffffff>/map loop-sound list
    '4': <#62748E>[Map] <#ffffff>/map loop-sound teleport <name>
  particle:
    header: <#E229FB>Particle Commands
    '1': <#62748E>[Map] <#ffffff>/map particle create <name> <type> <interval-ticks>
      <radius>
    '2': <#62748E>[Map] <#ffffff>/map particle remove <name>
    '3': <#62748E>[Map] <#ffffff>/map particle list
    '4': <#62748E>[Map] <#ffffff>/map particle teleport <name>
  pushback:
    header: <#E229FB>Pushback Commands
    '1': <#62748E>[Map] <#ffffff>/map pushback create <name> <radius> <velocity x>
      <velocity y>
    '2': <#62748E>[Map] <#ffffff>/map pushback remove <name>
    '3': <#62748E>[Map] <#ffffff>/map pushback list
    '4': <#62748E>[Map] <#ffffff>/map pushback teleport <name>
