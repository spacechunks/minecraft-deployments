logs:
  loaded: "<prefix><#a3e635>Successfully loaded on <os>"
  unloaded: "<prefix><#a3e635>Successfully unloaded"
  no_armor_item: "<prefix><#dc2626>No item matching <name> found. Unable to use <armor_layer_file>"
  duplicate_armor_color: "<prefix><#dc2626><first_armor_prefix> armor set uses the same color as <second_armor_prefix> with a different texture"

command:
  help: "<prefix><#737373>Available commands
        \n<hover:show_text:\"<gray>fill reload command\"><click:SUGGEST_COMMAND:/nexo reload ><#6f737d>/nexo
          <#737373>reload <#a3a3a3>type</click></hover>  <#6f737d>»<#737373> reload the plugin
        \n<hover:show_text:\"<gray>fill inv command\"><click:SUGGEST_COMMAND:/nexo inv><#6f737d>/nexo
          <#737373>inventory</click></hover>  <#6f737d>»<#737373> show nexo items in inventory
        \n<hover:show_text:\"<gray>fill pack command\"><click:SUGGEST_COMMAND:/nexo pack ><#6f737d>/nexo
          <#737373>pack <#43c9fa>target</click></hover>
        \n<hover:show_text:\"<gray>fill give command\"><click:SUGGEST_COMMAND:/nexo give ><#6f737d>/nexo
          <#737373>give <#43c9fa>target <#fa4362>item <#43fa8c>amount</click></hover>  <#6f737d>»<#737373> give a nexo item
        \n<hover:show_text:\"<gray>fill recipes show command\"><click:SUGGEST_COMMAND:/nexo recipes show ><#6f737d>/nexo
          <#737373>recipes show <#a3a3a3>type</click></hover>  <#6f737d>»<#737373> show recipes
        \n<hover:show_text:\"<gray>fill recipes builder command\"><click:SUGGEST_COMMAND:/nexo recipes builder ><#6f737d>/nexo
          <#737373>recipes builder <#a3a3a3>type</click></hover>  <#6f737d>»<#737373> open recipes builder
        \n<hover:show_text:\"<gray>fill recipes save command\"><click:SUGGEST_COMMAND:/nexo recipes save ><#6f737d>/nexo
          <#737373>recipes save <#faf443>name</click></hover>  <#6f737d>»<#737373> save recipe"

  join: |-
    <dark_gray><st>                           </st><dark_gray>{<aqua><bold>Resource Pack</bold><dark_gray>}<dark_gray><st>                        </st>
    <gray><bold>To see the new items you need to use a special resourcepack (but don't worry, this doesn't prevent you from using yours at the same time).</bold>
    <dark_gray>»<gray> To try to load it directly from the game, <click:run_command:"nexo pack send @p"><hover:show_text:"<red>! loading the resourcepack from the game can cause lags"><red><bold>CLICK HERE</bold></hover></click>
    <dark_gray>»<gray> To download it from the internet, <hover:show_text:"<pack_url> <green>! install it from Options/ResourcePacks in your game"><green><bold><click:OPEN_URL:"<pack_url>">CLICK HERE</click></bold></hover>

  recipe:
    no_builder: "<prefix><#dc2626>Please create a recipe first!"
    no_furnace: "<prefix><#dc2626>This option is only available for Furnace Recipes!"
    no_name: "<prefix><#dc2626>Please <gradient:#FA7CBB:#F14658>specify a name for the recipe!"
    no_recipes: "<prefix><#dc2626>There are no recipes to show!"
    no_item: "<prefix><#dc2626>Please specify an item!"
    save: "<prefix><#a3e635>Recipe '<name>' saved successfully!"

  give:
    player: "<prefix><#a3e635>You gave <#43c9fa><player><#a3e635> <#43fa8c><amount><#6f737d> × <#fa4362><item><#a3e635>!"
    players: "<prefix><#a3e635>You gave <#43c9fa><count><#a3e635> players <#43fa8c><amount><#6f737d> × <#fa4362><item><#a3e635>!"

  dye:
    success: "<prefix><#a3e635>You successfully changed the color of this item!"
    wrong_color: "<prefix><#dc2626>Color not recognized, try a hexadecimal color like #FFFFFF!"
    failed: "<prefix><#dc2626>You cannot change this item's color!"

  hud:
    no_hud: "<prefix><#dc2626>There is no HUD by the name '<hud_id>'!"
    toggle_on: "<prefix><#a3e635>Toggled '<hud_id>' on!"
    toggle_off: "<prefix><#dc2626>Toggled '<hud_id>' off!"

  debug.toggle: "<prefix><#a3e635>Debug mode is now <#43fa8c><state><#a3e635>!"
  version: "<prefix><#a3e635>Nexo version: <#43fa8c><version><#a3e635>!"

