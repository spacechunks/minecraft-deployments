name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUILD_OCI_REG_USER: ${{ github.repository_owner }}
      BUILD_OCI_REG_PASS: ${{ secrets.GITHU_TOKEN }}
      BUILD_OCI_REG_SERVER: ghcr.io
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: https://nbg1.your-objectstorage.com
      AWS_REGION: nbg1
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          # we need at least the last commit, so we can detect
          # where changes happened in build-blueprint.sh
          fetch-depth: 2
      - uses: hashicorp-contrib/setup-packer@v3
      - name: packet init
        run: |
          cd blueprints/paper && packer init . && cd -
          cd blueprints/velocity && packer init . && cd -
      - name: install sops
        run: |
          SOPS_VERSION=v3.12.2
          SOPS_ARCH=amd64
          curl -LO https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.$SOPS_ARCH
          mv sops-$SOPS_VERSION.linux.$SOPS_ARCH /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
      - run: ./scripts/build-blueprint.sh
