  require_player_if_permission: true
  reset_recipes: true
  add_recipes_to_book: true
  default_allow_in_vanilla_recipes: false
Pack:
  generation:
    legacy_atlas: true
    merge_textures: NONE
    force_oversized_in_gui: false
    generate_pack: true
    output_path: plugins/Nexo/pack/pack.zip
    prefer_item_models: true
    minimize_json: false
    read_lenient: true
    excluded_file_extensions:
    - .zip
    - .tar.gz
    - .psd
    packsquash:
      enabled: false
      executable_path: plugins/Nexo/pack/packsquash/packsquash
      settings_path: plugins/Nexo/pack/packsquash/packsquash.toml
      cache_size: 5
  obfuscation:
    type: NONE
    cache: true
  import:
    default_assets: false
    external_packs: false
    from_location: []
    from_url: []
    external_pack_order: []
    model_engine: true
  validate:
    models: true
    fonts: true
    atlas: true
    languages: true
  server:
    type: POLYMATH
    selfhost:
      public_address: ''
      port: 8082
      dispatch_threads: 10
    polymath:
      server: atlas.nexomc.com
      secret: nexomc
    lobfile:
      api_key: API-KEY
    s3:
      endpoint_url: https://fsn1.your-objectstorage.com
      path_style: false
      chunked_encoding: true
      public_url: https://nbg1.your-objectstorage.com
      region: nbg1
      bucket: spc-packs
      secret_key: 5nNluCQcHwF44WgPQ2gF07mdtS74BOKr3ti2Z5mP
      access_key: BNIOGI4SZOXZDQEFX6CG
      url_expiration: 7d
  dispatch:
    send_pre_join: false
    send_on_join: false
    send_on_reload: false
    delay: -1
    mandatory: true
    prompt: Accept the pack to enjoy a full experience
Furniture:
  allowed_gamemodes_for_rotation:
  - SURVIVAL
  - CREATIVE
  anti_cheat:
    spartan_hook: false
    vulcan_hook: false
  remove_invalid_furniture: false
