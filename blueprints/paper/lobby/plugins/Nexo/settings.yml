  keep_this_up_to_date: true
  formatting:
    chat: true
    chat_standard_tags: false
    chats:
      player_chat: true
      system_chat: true
      standard_tags: false
    cursor: false
    villagers: true
    translatable: false
    dialog: true
    anvil: true
    signs: true
    books: true
    tablist: true
    bossbar: true
    scoreboard: true
