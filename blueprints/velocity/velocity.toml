# Config version. Do not change this
config-version = "2.7"
show-max-players = 100

bind = "0.0.0.0:25577"

player-info-forwarding-mode = "modern"

[servers]
chunk-viewer = "chunk-viewer.minecraft.svc.cluster.local:25565"

try = [
    "chunk-viewer"
]

[forced-hosts]
"chunks.space" = [
    "chunk-viewer"
]
